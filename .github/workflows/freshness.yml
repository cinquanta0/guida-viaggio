name: guida-bot

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit copertura
        working-directory: Guida_Sicilia_Pipeline
        run: node audit_categorie.js || echo "audit saltato"

      - name: Rigenera il sito
        working-directory: Guida_Sicilia_Pipeline
        run: |
          node build.js
          node crediti.js
          node build_napoli.js

      - name: Deploy su Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@14 deploy --only hosting --project guida-sicilia-2026 --token "$FIREBASE_TOKEN"

      - name: Salva report
        run: |
          git config user.name "guida-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Guida_Sicilia_Pipeline/audit_categorie_report.md Guida_Sicilia_Sito/index.html Guida_Sicilia_Sito/napoli.html || true
          git commit -m "bot: audit + rebuild automatico" || echo "niente da committare"
          git push || true
